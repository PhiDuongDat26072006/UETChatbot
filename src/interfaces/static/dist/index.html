<!DOCTYPE html>
<html lang="vi" data-theme="light">

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>UET AI Assistant - Trợ Lý Học Vụ Sinh Viên (Telegram Fleet Edition)</title>
    <meta
      name="description"
      content="Hệ thống Chatbot RAG AI tra cứu quy chế đào tạo, học vụ, học bổng và thủ tục sinh viên Trường Đại học Công nghệ – ĐHQGHN"
    />
    <meta name="theme-color" content="#0054A6" />
    <link rel="icon" type="image/png" href="/static/uet-logo.png?v=v14_robot_mascot" />

    <!-- Pre-render Theme & Wallpaper to avoid FOUT -->
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("uet_ai_theme_mode");
          var theme = storedTheme === "dark" || storedTheme === "light" ? storedTheme : "light";
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }

          var storedWallpaper = localStorage.getItem("uet_ai_chat_wallpaper");
          var validWallpapers = ["telegram-blue", "plain", "dark-night"];
          var wallpaper =
            storedWallpaper && validWallpapers.indexOf(storedWallpaper) !== -1
              ? storedWallpaper
              : "telegram-blue";
          if (storedWallpaper === "telegram-green" || !storedWallpaper) {
            try {
              localStorage.setItem("uet_ai_chat_wallpaper", wallpaper);
            } catch (e) {}
          }
          document.documentElement.setAttribute("data-wallpaper", wallpaper);
        } catch (e) {}
      })();
    </script>
