site: TUYENSINH
version: 2

# ==============================================================================
# SEEDS
# ==============================================================================
seeds:
  # --- CORE SCOPE (Điểm chuẩn & Văn bản hướng dẫn tuyển sinh 2026) ---
  - https://tuyensinh.uet.vnu.edu.vn/category/tra-cuu/diem-chuan-cac-nganh/
  - https://tuyensinh.uet.vnu.edu.vn/category/tra-cuu/van-ban-huong-dan/

  # --- GENERAL SCOPE (Mở lại khi cào diện rộng toàn cổng tuyển sinh) ---
  # - https://tuyensinh.uet.vnu.edu.vn/
  # - https://tuyensinh.uet.vnu.edu.vn/category/tin-tuyen-sinh/
  # - https://tuyensinh.uet.vnu.edu.vn/category/phuong-thuc-xet-tuyen/
  # - https://tuyensinh.uet.vnu.edu.vn/category/ket-qua-xet-tuyen/
  # - https://tuyensinh.uet.vnu.edu.vn/category/nganh-theo-khoa/
  # - https://tuyensinh.uet.vnu.edu.vn/category/ban-nen-biet/
  # - https://tuyensinh.uet.vnu.edu.vn/category/tu-van-tuyen-sinh/
  # - https://tuyensinh.uet.vnu.edu.vn/category/tra-cuu/

# ==============================================================================
# SCOPE
# ==============================================================================
scope:
  hosts:
    - tuyensinh.uet.vnu.edu.vn

  path_prefixes:
    - /

  # --- CORE SCOPE: Whitelist chỉ nhận danh mục, văn bản năm 2026, điểm chuẩn và file PDF đính kèm ---
  include_patterns:
    - ^/category/tra-cuu/diem-chuan-cac-nganh
    - ^/category/tra-cuu/van-ban-huong-dan
    - '2026'
    - diem-trung-tuyen
    - diem-chuan
    - muc-diem-nhan-dang-ky
    - thong-bao-ket-qua
    - nguong-dau-vao-va-quy-doi-diem

  # --- GENERAL SCOPE ---
  # exclude_prefixes:
  #   - /wp-admin
  #   - /wp-login.php
  #   - /feed

  listing_exact:
    - /category/tra-cuu/diem-chuan-cac-nganh
    - /category/tra-cuu/van-ban-huong-dan
    # --- GENERAL SCOPE ---
    # - /
    # - /tin-tuc
    # - /thong-bao
    # - /dao-tao
    # - /nghien-cuu
    # - /sinh-vien
    # - /hop-tac
    # - /tuyen-sinh
    # - /tin-tuyen-sinh
    # - /nganh-dao-tao
    # - /phuong-thuc-xet-tuyen
    # - /ban-nen-biet
    # - /tra-cuu
    # - /huong-nghiep
    # - /tu-van-tuyen-sinh

  listing_patterns:
    - ^/category/tra-cuu/(diem-chuan-cac-nganh|van-ban-huong-dan)(/|$)
    - (?:^|/)page(?:/|$)
    # --- GENERAL SCOPE ---
    # - ^/(category|tag|author|page)(/|$)

# ==============================================================================
# DISCOVERY
# ==============================================================================
discovery:
  link_selectors:
    # --- CORE SCOPE: Bốc link bài viết trong danh sách, phân trang và PDF đính kèm ---
    - .content-wrapper article a[href]
    - .paginate_links a[href]
    - a.page-numbers

    # --- GENERAL SCOPE ---
    # - .content-wrapper a[href]
    # - .content-inside a[href]
    # - .hexagon-in1 a[href]
    # - '#main a[href]'
    # - '#page-wrapper a[href]'
    # - article a[href]

# ==============================================================================
# EXTRACTION
# ==============================================================================
extraction:
  content_selectors:
    - .content-wrapper-detail .content-inside
    - .content-inside
    - .content-wrapper-detail
    # --- GENERAL SCOPE ---
    # - .content-wrapper
    # - article .entry-content
    # - .single-content
    # - .post-content

  title_selectors:
    - h1
    - title
    # --- GENERAL SCOPE ---
    # - h1.entry-title
    # - h1.td-post-title

  date_selectors:
    - meta[property="article:published_time"]
    - time[datetime]
    - .entry-date

  remove_selectors:
    - .sidebar
    - .widget-area
    - .related-posts
    - .box-tu-van

quality:
  min_chars: 100
  max_link_density: 0.65

policy:
  published_after: null
  time_sensitive_patterns: []
  unknown_date: review
