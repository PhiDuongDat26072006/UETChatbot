discovery:
  link_selectors:
  - main a[href]
  - article a[href]
  - nav a[href]
  - .pagination a[href]
  - '#content a[href]'
  - '#wrapper a[href]'
  - .td-main-content-wrap a[href]
  - .container a[href]
extraction:
  content_selectors:
  - .content-detail
  - .post-content
  - .entry-content
  - .table-home > div:nth-child(1) > div:nth-child(1) > div:nth-child(1)
  title_selectors:
  - meta[property="og:title"]
  - title
  - h1.entry-title
  - h1.td-post-title
  - article h1
  title_attributes:
    meta[property="og:title"]: content
  date_selectors:
  - meta[property="article:published_time"]
  - time[datetime]
  - .entry-date
  remove_selectors:
  - .sidebar
  - .related-posts
quality:
  min_chars: 100
  max_link_density: 0.65
policy:
  published_after: null
  time_sensitive_patterns: []
  unknown_date: review
