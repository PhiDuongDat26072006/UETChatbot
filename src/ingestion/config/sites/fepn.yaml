site: FEPN
version: 1
url_normalization:
  canonical_origin: https://fepn.uet.vnu.edu.vn
  alias_hosts:
  - fepn.uet.vnu.edu.vn
# ==============================================================================
# CORE SCOPE (Active)
# ==============================================================================
seeds:
- https://fepn.uet.vnu.edu.vn/gioi-thieu/su-menh-va-tam-nhin
- https://fepn.uet.vnu.edu.vn/gioi-thieu/gioi-thieu-khoa-vat-ly-ky-thuat-va-cong-nghe-nano
- https://fepn.uet.vnu.edu.vn/gioi-thieu/tap-the-lanh-dao
- https://fepn.uet.vnu.edu.vn/gioi-thieu/doi-ngu-giang-vien
scope:
  hosts:
  - fepn.uet.vnu.edu.vn
  path_prefixes:
  - /
  include_patterns:
  - ^/gioi-thieu/(?:su-menh-va-tam-nhin|gioi-thieu-khoa-vat-ly-ky-thuat-va-cong-nghe-nano|tap-the-lanh-dao|doi-ngu-giang-vien)/?$
  exclude_prefixes:
  - /wp-admin
  - /wp-login.php
  - /feed

