site: FEPN
version: 1
seeds:
- https://fepn.uet.vnu.edu.vn/
scope:
  hosts:
  - fepn.uet.vnu.edu.vn
  path_prefixes:
  - /
  exclude_prefixes:
  - /wp-admin
  - /wp-login.php
  - /feed
  listing_exact:
  - /
  - /tin-tuc
  - /thong-bao
  - /dao-tao
  - /nghien-cuu
  - /sinh-vien
  - /hop-tac
  - /tuyen-sinh
  - /gioi-thieu
  - /to-chuc
  - /dao-tao/dai-hoc
  - /dao-tao/sau-dai-hoc
  listing_patterns:
  - ^/(category|tag|author|page)(/|$)
discovery:
  link_selectors:
  - main a[href]
  - article a[href]
  - nav a[href]
  - .pagination a[href]
  - '#content a[href]'
  - '#wrapper a[href]'
  - .td-main-content-wrap a[href]
  - .container a[href]
extraction:
  content_selectors:
  - .content-detail
  - .post-content
  - .entry-content
  - .table-home > div:nth-child(1) > div:nth-child(1) > div:nth-child(1)
  title_selectors:
  - h1.entry-title
  - h1.td-post-title
  - article h1
  - h1
  - title
  date_selectors:
  - meta[property="article:published_time"]
  - time[datetime]
  - .entry-date
  remove_selectors:
  - .sidebar
  - .related-posts
quality:
  min_chars: 100
  max_link_density: 0.65
policy:
  published_after: null
  time_sensitive_patterns: []
  unknown_date: review
