# ==============================================================================
# DISCOVERY
# ==============================================================================
discovery:
  link_selectors:
    # --- CORE SCOPE: Bốc link bảng CTĐT và bài viết trọng tâm ---
    - table a[href]
    - .entry-content a[href]
    - .elementor-widget a[href]
    - '#content a[href]'

    # --- GENERAL SCOPE ---
    # - .elementor-element a[href]
    # - .event-wrapper a[href]
    # - .jw-posts a[href]
    # - .item-post a[href]
    # - .sc-list-post a[href]
    # - nav a[href]
    # - .container a[href]
    # - article a[href]
    # - .pagination a[href]
    # - main a[href]

# ==============================================================================
# EXTRACTION
# ==============================================================================
extraction:
  content_selectors:
    - .entry-content
    - .page-content-inner > .entry-content
    - '#content .container'
    # --- GENERAL SCOPE ---
    # - .entry-content:not(.des-related)
    # - .single-post .entry-content
    # - article.post .entry-content
    # - .page .entry-content
    # - .post-content

  title_selectors:
    - h1.entry-title
    - h1
    # --- GENERAL SCOPE ---
    # - h1.td-post-title
    # - article h1
    # - title

  date_selectors:
    - meta[property="article:published_time"]
    - time[datetime]
    - .entry-date

  remove_selectors:
    - .sidebar
    - aside
    - .site-footer
    # --- GENERAL SCOPE ---
    # - .related-posts
    # - .post-views
    # - .breadcrumbs
    # - .entry-tag-share
    # - .entry-navigation-post
    # - .archived-posts
    # - .related-area-site-content

quality:
  min_chars: 100
  max_link_density: 0.65

policy:
  published_after: null
  time_sensitive_patterns: []
  unknown_date: review
