    - uet.edu.vn
    - uet.vnu.edu.vn
    - uet-test.uet.edu.vn
    - 2489013871.e.cdneverest.net
    - 2679558515.e.cdneverest.net

  path_prefixes:
    - /

  # --- CORE SCOPE: Whitelist chỉ nhận CTĐT, Ngoại ngữ và PDF ---
  include_patterns:
    - ^/dao-tao/?$
    - ^/chuong-trinh-dao-tao
    - ^/minh-chung-chuan-dau-ra-trinh-ngoai-ngu-duoc-su-dung-de-xet-tot-nghiep-bac-dai-hoc/?$
    # Chỉ nhận ĐÚNG 3 file PDF đã chỉ định cụ thể, TUYỆT ĐỐI không nhận các file PDF khác:
    - 2\.Huong-dan-danh-gia-DRL\.pdf$
    - Quy-dinh-Hoc-bong-KKHT-UET-2026\.pdf$
    - 1011\.pdf$

