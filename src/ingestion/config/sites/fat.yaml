site: FAT
version: 2
url_normalization:
  canonical_origin: https://fat.uet.vnu.edu.vn
  alias_hosts:
  - fat.uet.vnu.edu.vn
# ==============================================================================
# CORE SCOPE (Active)
# ==============================================================================
seeds:
- https://fat.uet.vnu.edu.vn/chien-luoc-khoa
- https://fat.uet.vnu.edu.vn/ban-chu-nhiem-khoa
- https://fat.uet.vnu.edu.vn/cac-can-bo-giang-vien-trong-khoa
scope:
  hosts:
  - fat.uet.vnu.edu.vn
  path_prefixes:
  - /
  include_patterns:
  - ^/(?:chien-luoc-khoa|ban-chu-nhiem-khoa|cac-can-bo-giang-vien-trong-khoa)/?$
  exclude_prefixes:
  - /wp-admin
  - /wp-login.php
  - /feed

