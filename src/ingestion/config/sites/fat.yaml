discovery:
  link_selectors:
  - .header a[href]
  - .container a[href]
  - .left-col a[href]
  - .category a[href]
  - .item a[href]
  - .a-detail a[href]
  - .pagination a[href]
  - main a[href]
  - article a[href]
  - nav a[href]
  - '#content a[href]'
  - '#wrapper a[href]'
  - .td-main-content-wrap a[href]
extraction:
  content_selectors:
  - .a-detail
  - .category
  - .left-col
  - .a-detail-content
  - .content-detail
  - .entry-content
  - .post-content
  title_selectors:
  - h1.a-detail-title
  - h1.category-title
  - h1.entry-title
  - h1.td-post-title
  - article h1
  - h1
  - h2
  - title
  date_selectors:
  - span.item-date
  - .item-date
  - .item-date-view
  - meta[property="article:published_time"]
  - time[datetime]
  - .entry-date
  remove_selectors:
  - .right-col
  - .sidebar
  - .related-articles
  - .item-links-bottom
  - .item-links-top
  - .item-tags
  - .doc-outline
  - .text-btns
  - .item-view
  - .share-box
  - .related-news
  - .category-header
quality:
  min_chars: 100
  max_link_density: 0.75
policy:
  published_after: null
  time_sensitive_patterns: []
  unknown_date: review
