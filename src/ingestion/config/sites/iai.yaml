site: IAI
version: 1
url_normalization:
  canonical_origin: https://uet.vnu.edu.vn
  alias_hosts:
  - uet.vnu.edu.vn
seeds:
- https://uet.vnu.edu.vn/vien-tri-tue-nhan-tao/
- https://uet.vnu.edu.vn/chuong-trinh-dao-tao-khoa-hoc-va-ky-thuat-du-lieu-nganh-khoa-hoc-du-lieu-4/
- https://uet.vnu.edu.vn/chuong-trinh-dao-tao-nganh-tri-tue-nhan-tao-3/
- https://tuyensinh.uet.vnu.edu.vn/ban-nen-biet/thong-bao-nguong-dau-vao-va-quy-doi-diem-trong-xet-tuyen-dhcq-nam-2025/
- https://tuyensinh.uet.vnu.edu.vn/ban-nen-biet/thong-tin-tuyen-sinh-dhcq-nam-2026-cap-nhat/
scope:
  hosts:
  - uet.vnu.edu.vn
  path_prefixes:
  - /vien-tri-tue-nhan-tao
  include_patterns:
  - ^/vien-tri-tue-nhan-tao/?$
  exclude_prefixes:
  - /wp-admin
  - /wp-login.php
  - /feed
  listing_exact: []
  listing_patterns:
  - ^/(category|tag|author|page)(/|$)
  exact_paths:
  - /vien-tri-tue-nhan-tao
discovery:
  start_urls:
  - https://uet.vnu.edu.vn/vien-tri-tue-nhan-tao/
  link_selectors:
  - main a[href]
  - article a[href]
  - nav a[href]
  - .pagination a[href]
  - '#content a[href]'
  - '#wrapper a[href]'
  - .td-main-content-wrap a[href]
  - .container a[href]
extraction:
  content_selectors:
  - .entry-content
  - .page-content
  - main#main
  - '#content'
  title_selectors:
  - h1.entry-title
  - h1.td-post-title
  - article h1
  - h1
  - title
  date_selectors:
  - meta[property="article:published_time"]
  - time[datetime]
  - .entry-date
  remove_selectors:
  - .sidebar
  - .related-posts
quality:
  min_chars: 100
  max_link_density: 0.65
policy:
  published_after: null
  time_sensitive_patterns: []
  unknown_date: review
