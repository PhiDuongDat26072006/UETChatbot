site: FCE
version: 1
# NOTE: Server fce.uet.vnu.edu.vn is currently returning 504 Gateway Timeout (offline).
seeds: []
scope:
  hosts:
  - fce.uet.vnu.edu.vn
  path_prefixes:
  - /
  exclude_prefixes:
  - /wp-admin
  - /wp-login.php
  - /feed

