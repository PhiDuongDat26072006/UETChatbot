# CLI arguments override these defaults. Restart the process after editing.
ingestion:
  max_pages: 10000
  max_depth: 4
  limit: null
  download_workers: 120
  site_workers: 4
  flush_every: 20
  per_host: 30
  extract_workers: 10
  stream_extract_workers: 10  # null => equals download_workers
  timeout: 30
  max_html_bytes: 20971520
  retries: 3
  delay: 0.25
pdf:
  rpm: 5
  retries: 3
