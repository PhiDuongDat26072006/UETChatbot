# =========================================================================
# CẤU HÌNH THAM SỐ TOÀN DIỆN CHO HỆ THỐNG UET RAG CHATBOT
# =========================================================================

paths:
  data_dir: "data/raw_data"
  processed_dir: "data/processed_data"
  eval_dir: "data/eval_data"
  vector_db_dir: "database/vector_db"
  bm25_index_file: "database/bm25_index.pkl"
  collection_name: "chatbot_collection"
  eval_dataset_dir: "data/eval_data/uet_domain_qa"
  eval_dataset_file: "data/eval_data/uet_domain_qa/overview1_qa.json"

chunking:
  chunk_size: 800
  chunk_overlap: 150
  min_chunk_size: 100
  separators:
    - 'regex:(?<=\n)(?=(?:Chương|CHƯƠNG)\s+[IVXLCDM\d]+)'
    - 'regex:(?<=\n)(?=(?:Mục|MỤC)\s+\d+)'
    - 'regex:(?<=\n)(?=(?:Điều|ĐIỀU)\s+\d+[\.:])'
    - "### "
    - "## "
    - "# "
    - 'regex:(?<=\n)(?=(?:Khoản\s+\d+[\.:]|\d+\.\s))'
    - "\n\n"
    - "\n"
    - ". "
    - "; "
    - " "
    - ""

embedding:
  # Mô hình embedding chuẩn hóa cho toàn bộ hệ thống UET Chatbot
  # BAAI/bge-m3 (1024 chiều, chạy cục bộ offline qua sentence-transformers)
  provider: "bge-m3"
  model_name: "BAAI/bge-m3"
  dimension: 1024

retrieval:
  bm25_top_k: 100              # Số ứng viên BM25 lấy ra
  vector_top_k: 100            # Số ứng viên Vector search lấy ra
  candidate_pool_size: 100     # Số ứng viên sau khi ghép Hybrid Search (~100 chunks)
  rerank_top_n: 20             # Số đoạn giữ lại sau Reranker (20 chunks)
  final_top_k: 5              # Số đoạn cuối cùng trả về cho LLM (K=5 hoặc 10)
  fusion_method: "rrf"         # Thuật toán ghép: "rrf" (Reciprocal Rank Fusion)
  rrf_k: 60                    # Hằng số làm mượt RRF
  vector_weight: 0.6           # Trọng số nhánh Vector Search
  bm25_weight: 0.4             # Trọng số nhánh BM25 Search
  reranker_type: "cross_encoder"        # "auto", "heuristic", "flashrank", "cross_encoder"
  reranker_model: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
  score_threshold: null        # Ngưỡng điểm tối thiểu (tùy chọn)

  # Cấu hình Mở rộng ngữ cảnh Liền kề (Adjacent Chunk Expansion & Contiguous Merging)
  enable_adjacent_expansion: true       # Bật/tắt mở rộng ngữ cảnh liền kề
  adjacent_expansion_top_k: 3           # Chỉ mở rộng ngữ cảnh cho Top K chunk điểm cao nhất (Top 3)
  adjacent_window_size: 1               # Bán kính cửa sổ liền kề (1 = lấy chunk_index - 1 và + 1)
  merge_contiguous_chunks: true         # Tự động gộp các chunk nối tiếp trong cùng văn bản thành 1 khối

llm:
  provider: "groq"             # Nhà cung cấp mô hình ngôn ngữ lớn (Groq API)
  # Mô hình Groq LPU tốc độ cao (~250-800 tokens/s)
  model_name: "qwen/qwen3.8-27b"
  candidate_models:
    - "llama-3.1-8b-instant"
  temperature: 0.3
  top_k_retrieval: 5

api:
  host: "127.0.0.1"
  port: 8000
  title: "UET Academic Regulations Chatbot API"
  version: "1.0.0"

prompt:
  system_prompt: |
    Bạn là trợ lý ảo tư vấn quy chế đào tạo và học vụ của Trường Đại học Công nghệ - ĐHQGHN (UET Chatbot).
    Nhiệm vụ của bạn là giải đáp thắc mắc của sinh viên một cách chính xác, thân thiện, rõ ràng dựa trên các tài liệu quy chế được cung cấp.

    Quy tắc bắt buộc:
    1. Chỉ sử dụng thông tin có trong phần [NGỮ CẢNH ĐƯỢC CUNG CẤP] được trích xuất để trả lời.
    2. Nếu ngữ cảnh không có thông tin hoặc không đủ để trả lời câu hỏi, hãy trả lời lịch sự: "Xin lỗi em, hiện tại trong các văn bản quy chế lưu trữ chưa có thông tin cụ thể về câu hỏi này. Em vui lòng liên hệ trực tiếp Phòng Đào tạo (Phòng 105-E3) hoặc Cổng thông tin đào tạo UET để được hướng dẫn chính xác nhất nhé." Tuyệt đối không tự bịa đặt thông tin.
    3. Trả lời bằng tiếng Việt chuẩn mực, mạch lạc, có thể dùng gạch đầu dòng để làm rõ các điều kiện, tiêu chí.
    4. Cuối câu trả lời, hãy nêu rõ nguồn tài liệu tham khảo (Tên file, văn bản hoặc số quyết định) được trích xuất từ ngữ cảnh.
