# =========================================================================
# CẤU HÌNH THAM SỐ TOÀN DIỆN CHO HỆ THỐNG UET RAG CHATBOT
# =========================================================================

paths:
  data_dir: "data/raw_data"
  processed_dir: "data/processed_data"
  vector_db_dir: "database/vector_db"
  bm25_index_file: "database/bm25_index.pkl"
  collection_name: "chatbot_collection"
  eval_dataset_dir: "data/eval_data/"
  eval_dataset_file: "data/eval_data/e2e_eval_100_annotated.json"

chunking:
  chunk_size: 800
  chunk_overlap: 150
  min_chunk_size: 100
  separators:
    - 'regex:(?<=\n)(?=(?:Chương|CHƯƠNG)\s+[IVXLCDM\d]+)'
    - 'regex:(?<=\n)(?=(?:Mục|MỤC)\s+\d+)'
    - 'regex:(?<=\n)(?=(?:Điều|ĐIỀU)\s+\d+[\.:])'
    - "### "
    - "## "
    - "# "
    - 'regex:(?<=\n)(?=(?:Khoản\s+\d+[\.:]|\d+\.\s))'
    - "\n\n"
    - "\n"
    - ". "
    - "; "
    - " "
    - ""

embedding:
  # Mô hình embedding chuẩn hóa cho toàn bộ hệ thống UET Chatbot
  # BAAI/bge-m3 (1024 chiều, chạy cục bộ offline qua sentence-transformers)
  provider: "bge-m3"
  model_name: "weights/bge-m3"
  dimension: 1024

retrieval:
  #Cấu hình hybric search 
  fusion_method: "rrf"         # Thuật toán ghép: "rrf" (Reciprocal Rank Fusion)
  rrf_k: 60                    # Hằng số làm mượt RRF
  vector_weight: 0.6           # Trọng số nhánh Vector Search
  bm25_weight: 0.4             # Trọng số nhánh BM25 Search
  bm25_top_k: 50              # Số ứng viên BM25 lấy ra
  vector_top_k: 50            # Số ứng viên Vector search lấy ra
  candidate_pool_size: 50     # Số ứng viên sau khi ghép Hybrid Search (~100 chunks)
  
  # Cấu hình Maximal Marginal Relevance (MMR) đa dạng hóa ngữ cảnh trước Reranker
  enable_mmr: true                      # Bật/tắt tầng đa dạng hóa MMR trước Reranker
  mmr_lambda: 0.7                       # Cân bằng giữa Relevance (1.0) và Diversity (0.0). Khuyến nghị: 0.5 - 0.7
  mmr_top_n: 20                         # Số lượng ứng viên đa dạng giữ lại sau MMR để chuyển tiếp cho Reranker

  # cấu hình reranker
  rerank_top_n: 20             # Số đoạn giữ lại sau Reranker (20 chunks)
  final_top_k: 2              # Số đoạn cuối cùng trả về cho LLM (K=5 hoặc 10)
  reranker_type: "onnx"                 # "auto", "heuristic", "flashrank", "cross_encoder", "onnx", "viranker"
  reranker_model: "weights/jina-reranker-v2-base-multilingual"
  onnx_filename: "weights/jina-reranker-v2-base-multilingual/onnx/model.onnx"
  score_threshold: null        # Ngưỡng điểm tối thiểu (tùy chọn)

  # Cấu hình Mở rộng ngữ cảnh Liền kề (Adjacent Chunk Expansion & Contiguous Merging)
  enable_adjacent_expansion: true       # Bật/tắt mở rộng ngữ cảnh liền kề
  adjacent_expansion_top_k: 3           # Chỉ mở rộng ngữ cảnh cho Top K chunk điểm cao nhất (Top 3)
  adjacent_window_size: 1               # Bán kính cửa sổ liền kề (1 = lấy chunk_index - 1 và + 1)
  merge_contiguous_chunks: true         # Tự động gộp các chunk nối tiếp trong cùng văn bản thành 1 khối

llm:
  provider: "groq"             # Nhà cung cấp mặc định ("groq", "sambanova", "gemini")
  model_name: "qwen/qwen3.8-27b"
  candidate_models:
    - "qwen/qwen3.8-27b"
    - "openai/gpt-oss-20b"
    - "llama-3.1-8b-instant"
  temperature: 0.2
  top_k_retrieval: 5
  enable_disk_cache: true
  cache_file: "database/llm_cache.json"

  # Cấu hình đa luồng phân tải (Multi-Provider Queue cho Evaluation)
  providers:
    groq:
      model: "qwen/qwen3.8-27b"
      delay_seconds: 2.0       # 30 câu/phút
    sambanova:
      model: "DeepSeek-V3.1"
      delay_seconds: 2.5       # 24 câu/phút
    gemini:
      model: "gemini-3.5-flash"
      delay_seconds: 4.0       # 15 câu/phút

api:
  host: "127.0.0.1"
  port: 8000
  title: "UET Academic Regulations Chatbot API"
  version: "1.0.0"

prompt:
  system_prompt: |
    Bạn là trợ lý ảo AI chuyên viên tư vấn quy chế đào tạo và học vụ của Trường Đại học Công nghệ - ĐHQGHN (UET Chatbot).
    Nhiệm vụ của bạn là giải đáp thắc mắc của sinh viên một cách chính xác, thân thiện, rõ ràng và chuyên nghiệp dựa trên các tài liệu quy chế được cung cấp.

    QUY TẮC BẮT BUỘC:
    1. CHỈ SỬ DỤNG THÔNG TIN TRONG [NGỮ CẢNH ĐƯỢC CUNG CẤP]: Mọi khẳng định, điều kiện, số liệu (điểm GPA, số tín chỉ, mốc thời gian, học phí...) phải có căn cứ rõ ràng từ các tài liệu được trích xuất. Tuyệt đối không suy diễn, suy đoán hoặc tự bịa đặt thông tin ngoài tài liệu.
    2. NGUYÊN TẮC TRUNG THỰC: Nếu ngữ cảnh không có thông tin hoặc không đủ để trả lời câu hỏi, hãy trả lời lịch sự: "Xin lỗi em, hiện tại trong các văn bản quy chế lưu trữ chưa có thông tin cụ thể về câu hỏi này. Em vui lòng liên hệ trực tiếp Phòng Đào tạo (Phòng 105-E3) hoặc Cổng thông tin đào tạo UET để được hướng dẫn chính xác nhất nhé." Tuyệt đối không tự suy diễn.
    3. NGUYÊN TẮC TRÌNH BÀY ĐẸP, GỌN GÀNG & BẮT BUỘC SỬ DỤNG BẢNG (MARKDOWN TABLE):
       - Tuyệt đối không viết thành một khối văn bản dài toàn chữ. Hãy tổ chức bố cục trực quan, đẹp mắt, có phân cấp rõ ràng:
         + Dùng 1-2 câu mở đầu tóm tắt trực diện câu trả lời.
         + BẮT BUỘC SỬ DỤNG BẢNG MARKDOWN (| Cột 1 | Cột 2 | ...) để tổng hợp, so sánh hoặc hệ thống hóa dữ liệu bất cứ khi nào câu hỏi liên quan đến:
           * Chuẩn đầu ra ngoại ngữ (bảng quy đổi chứng chỉ IELTS, TOEFL, TOEIC, VSTEP, Aptis, JLPT... theo Bậc 3 CTĐT chuẩn và Bậc 4 CTĐT CLC).
           * Tiêu chuẩn, điều kiện xét học bổng, làm khóa luận tốt nghiệp, xét tốt nghiệp, khen thưởng.
           * Thang điểm, xếp loại học lực, quy đổi điểm (GPA, điểm hệ 4, hệ 10, điểm chữ A/B/C/D/F).
           * Định mức số tín chỉ (tối thiểu, tối đa), mốc thời gian đăng ký học phần, rút bớt học phần, học cải thiện điểm.
           * Các mức cảnh báo học tập, buộc thôi học, mức độ kỷ luật học vụ.
           * Quy trình, thủ tục hành chính học vụ (Bước | Nội dung thực hiện | Thời hạn / Đơn vị tiếp nhận).
         + ĐẶC BIỆT QUAN TRỌNG: Nếu trong ngữ cảnh được cung cấp có bảng số liệu hoặc bảng quy đổi chuẩn (như bảng chứng chỉ ngoại ngữ, bảng điểm, bảng tín chỉ), BẮT BUỘC phải tái hiện lại đầy đủ dưới dạng Bảng Markdown (| Cột 1 | Cột 2 | ...), TUYỆT ĐỐI KHÔNG tự ý rút gọn hay tóm tắt thành các gạch đầu dòng toàn chữ.
         + Bảng phải có tiêu đề rõ ràng, các cột cân đối, nội dung từng ô ngắn gọn, dễ nắm bắt.
         + Sau bảng, dùng danh sách gạch đầu dòng (•) hoặc khối trích dẫn (> Lưu ý quan trọng) để nhấn mạnh các lưu ý, điều kiện kèm theo hoặc trường hợp đặc biệt.
    4. NÊU RÕ VĂN BẢN CĂN CỨ: Cuối câu trả lời, luôn ghi rõ nguồn tham khảo: "📌 Căn cứ quy chế: [Tên file / văn bản / số quyết định / trang]".
